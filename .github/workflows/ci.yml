name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Cache builder bundle
        uses: actions/cache@v5
        with:
          path: ~/.cache/binate/builders
          key: builders-${{ hashFiles('BUILDER_VERSION') }}

      # GitHub's ubuntu-latest image already carries the peer toolchains
      # (gcc/g++, go, rustc, javac/java, python3); run.sh skips any that are
      # absent. This is where the Rust and Java implementations get exercised.
      - name: Cross-language agreement + reference pin
        run: |
          set -e
          for d in bench/*/; do
            name="$(basename "$d")"
            echo "::group::$name — cross-language agreement (small N)"
            CHECK=1 ROUNDS=1 ./scripts/run.sh "$name"
            echo "::endgroup::"
            echo "::group::$name — reference pin (canonical N)"
            ROUNDS=1 ./scripts/run.sh "$name" c
            echo "::endgroup::"
          done
